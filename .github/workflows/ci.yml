name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install tool dependencies
        run: npm ci

      - name: Install fixture dependencies
        run: |
          npm --prefix fixtures/process-stub ci
          npm --prefix fixtures/ghsa-mfr8-vulnerable ci
          npm --prefix fixtures/ghsa-mfr8-patched ci
          npm --prefix fixtures/ghsa-vc7v-vulnerable ci
          npm --prefix fixtures/ghsa-vc7v-patched ci
          npm --prefix fixtures/ghsa-rhh4-vulnerable ci
          npm --prefix fixtures/ghsa-rhh4-patched ci
          npm --prefix fixtures/ghsa-vvgp-vulnerable ci
          npm --prefix fixtures/ghsa-vvgp-patched ci

      - name: Unit and integration tests
        run: npm test

      - name: Build CLI
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: Pack exclusion check
        run: npm run pack:check

      - name: Published suite (mfr8 + vc7v + rhh4 + vvgp)
        run: node dist/cli/index.js test --suite published --base-port 43110

      - name: Consumer Action smoke (rhh4 via composite action)
        uses: ./
        with:
          config: examples/custom-suite.rhh4.yml
          base-port: "43210"
          run-doctor: "true"
          report-artifact-name: next-cache-isolation-action-report

      - name: Upload published-suite report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: next-cache-isolation-report
          path: .next-cache-isolation/report.json
          if-no-files-found: ignore
